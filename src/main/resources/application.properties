# Application Configuration
server.port=8080
spring.application.name=springboot

# ========================================
# MySQL Database Configuration
# ========================================
# Override via environment variables in each environment; the password has no default.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/userdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:springuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# JWT Configuration
# ========================================
jwt.expiration=36000000
# Base64-encoded secret, at least 32 bytes. Required: set the JWT_SECRET environment variable.
# Generate one with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}

# ========================================
# Logging Configuration
# ========================================
logging.level.root=INFO
logging.level.com.learning.springboot=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Pretty print JSON responses

allowPublicKeyRetrieval=true